#  ╚══╝╚══╝ ╚═╝╚═╝  ╚═══╝╚═════╝  ╚═════╝  ╚══╝╚══╝ ╚═╝  ╚═╝ ╚═════╝ ╚══════╝╚══════╝
#------------------------------------------------------------------------------------

windowrule {
  # Ignore maximize requests from all apps. You'll probably like this.
  name = suppress-maximize-events
  match:class = .*

  suppress_event = maximize
}

windowrule {
  # Fix some dragging issues with XWayland
  name = fix-xwayland-drags
  match:class = ^$
  match:title = ^$
  match:xwayland = true
  match:float = true
  match:fullscreen = false
  match:pin = false

  no_focus = true
}

# Hyprland-run windowrule
windowrule {
  name = move-hyprland-run

  match:class = hyprland-run

  move = 20 monitor_h-120
  float = yes
}

# -----------------------------------------------------
# Floating Windows & Dialogues
# -----------------------------------------------------

# Make standard file picker dialogues float and center
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, center on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, size 900 600

# Catch common dialogue titles (handles open/save pop-ups)
windowrule = match:title ^(Open File|Select Folder|Save As|Confirm to replace files)$, float on
windowrule = match:title ^(Open File|Select Folder|Save As|Confirm to replace files)$, center on

# Make Nautilus float, set size, and center it
windowrule = match:class ^(org.gnome.Nautilus)$, float on
windowrule = match:class ^(org.gnome.Nautilus)$, size 950 600
windowrule = match:class ^(org.gnome.Nautilus)$, center on

# -----------------------------------------------------
# Waybar GUI Applets (Bluetooth, Network, Audio)
# -----------------------------------------------------

windowrule = match:class ^(pavucontrol|blueman-manager|nm-connection-editor|org.pulseaudio.pavucontrol)$, float on
windowrule = match:class ^(pavucontrol|blueman-manager|nm-connection-editor|org.pulseaudio.pavucontrol)$, center on
windowrule = match:class ^(pavucontrol|blueman-manager|nm-connection-editor|org.pulseaudio.pavucontrol)$, size 700 500

# -----------------------------------------------------
# Browser pop-ups (OAuth flows, JS window.open, auth dialogs)
# -----------------------------------------------------

windowrule = match:class ^(firefox|firefox-esr|librewolf|zen-browser|chromium|Chromium-browser|google-chrome|Google-chrome|brave-browser|Brave-browser|microsoft-edge|vivaldi-stable)$, match:initial_title ^(Untitled.*|)$, float on
windowrule = match:class ^(firefox|firefox-esr|librewolf|zen-browser|chromium|Chromium-browser|google-chrome|Google-chrome|brave-browser|Brave-browser|microsoft-edge|vivaldi-stable)$, match:initial_title ^(Untitled.*|)$, center on
windowrule = match:class ^(firefox|firefox-esr|librewolf|zen-browser|chromium|Chromium-browser|google-chrome|Google-chrome|brave-browser|Brave-browser|microsoft-edge|vivaldi-stable)$, match:initial_title ^(Untitled.*|)$, size 800 600

# Firefox Picture-in-Picture — small, pinned across workspaces
windowrule {
  name = browser-pip

  match:title = ^(Picture-in-Picture)$

  float = yes
  size = 480 270
  pin = yes
}

# -----------------------------------------------------
# Image viewers (Eye of GNOME, Loupe)
# -----------------------------------------------------
windowrule {
  name = image-viewer-float

  match:class = ^(eog|org.gnome.eog|loupe|org.gnome.Loupe)$

  float = yes
  size = 75% 75%
  center = 1
}

# -----------------------------------------------------
# PDF viewers (Evince, Papers, Zathura, Okular)
# -----------------------------------------------------
windowrule = match:class ^(evince|org.gnome.Evince|papers|org.gnome.Papers|org.pwmt.zathura|org.kde.okular|mupdf)$, float on
windowrule = match:class ^(evince|org.gnome.Evince|papers|org.gnome.Papers|org.pwmt.zathura|org.kde.okular|mupdf)$, size 1600 1000
windowrule = match:class ^(evince|org.gnome.Evince|papers|org.gnome.Papers|org.pwmt.zathura|org.kde.okular|mupdf)$, center on

# -----------------------------------------------------
# Single-file text editors
# -----------------------------------------------------
windowrule {
  name = text-editor-float

  match:class = ^(org.gnome.TextEditor|gedit|org.gnome.gedit|mousepad|xed|org.gnome.gitlab.somas.Apostrophe)$

  float = yes
  size = 75% 75%
  center = 1
}

# -----------------------------------------------------
# Bitwarden
# -----------------------------------------------------
windowrule {
  name = Bitwarden
  match:class = ^(Bitwarden|obsidian)$
  float = yes
  center = 1
  size = 1280 720
}

# -----------------------------------------------------
# nmTUI
# -----------------------------------------------------
windowrule {
  name = nmtui

  match:class = ^(kitty)$
  match:title = ^(nmtui)$

  float = yes
  center = 1
  size = 1280 720
}

# -----------------------------------------------------
# HyprHelp
# -----------------------------------------------------
windowrule {
  name = hyprhelp-overlay
  match:title = ^(hyprhelp)$
  float = on
  center = on
  size = 1280 720
  dim_around = on
  stay_focused = on
}

# -----------------------------------------------------
# Slack
# -----------------------------------------------------
windowrule = match:class ^(slack|Slack|com.slack.Slack)$, float on
windowrule = match:class ^(slack|Slack|com.slack.Slack)$, center on
windowrule = match:class ^(slack|Slack|com.slack.Slack)$, size 1280 720
windowrule = match:class ^(slack|Slack|com.slack.Slack)$, match:title ^(.*Huddle.*)$, float on
windowrule = match:class ^(slack|Slack|com.slack.Slack)$, match:title ^(.*Huddle.*)$, center on
windowrule = match:class ^(slack|Slack|com.slack.Slack)$, match:title ^(.*Huddle.*)$, size 500 400

# -----------------------------------------------------
# TeamViewer
# -----------------------------------------------------
windowrule = match:class ^(TeamViewer|teamviewer)$, float on
windowrule = match:class ^(TeamViewer|teamviewer)$, center on
windowrule = match:class ^(TeamViewer|teamviewer)$, size 1280 720

