# ██║███╗██║██║██║╚██╗██║██║  ██║██║   ██║██║███╗██║██╔══██╗██║   ██║██║     ██╔══╝
# ╚███╔███╔╝██║██║ ╚████║██████╔╝╚██████╔╝╚███╔███╔╝██║  ██║╚██████╔╝███████╗███████╗
#  ╚══╝╚══╝ ╚═╝╚═╝  ╚═══╝╚═════╝  ╚═════╝  ╚══╝╚══╝ ╚═╝  ╚═╝ ╚═════╝ ╚══════╝╚══════╝
#------------------------------------------------------------------------------------

windowrule {
  name = suppress-maximize-events
  match:class = .*
  suppress_event = maximize
}

windowrule {
  name = fix-xwayland-drags
  match:class = ^$
  match:title = ^$
  match:xwayland = true
  match:float = true
  match:fullscreen = false
  match:pin = false
  no_focus = true
}

windowrule {
  name = move-hyprland-run
  match:class = hyprland-run
  move = 20 monitor_h-120
  float = yes
}

# -----------------------------------------------------
# File Dialogues & Portals
# -----------------------------------------------------
windowrule {
  name = portal-gtk-dialog
  match:class = ^(xdg-desktop-portal-gtk)$
  float = yes
  center = 1
  size = 900 600
}

windowrule {
  name = file-picker-dialogs
  match:title = ^(Open File|Select Folder|Save As|Confirm to replace files|Open Folder|Save File|File Upload)$
  float = yes
  center = 1
  size = 900 600
}

windowrule {
  name = nautilus-float
  match:class = ^(org.gnome.Nautilus)$
  float = yes
  center = 1
  size = 950 600
}

windowrule {
  name = system-applets-float
  match:class = ^(pavucontrol|blueman-manager|nm-connection-editor|org.pulseaudio.pavucontrol)$
  float = yes
  center = 1
  size = 700 500
}

# -----------------------------------------------------
# Browser Pop-ups, Extensions & OAuth Dialogues (Dynamic)
# -----------------------------------------------------
windowrule = float = yes, match:title = .*Bitwarden.*
windowrule = center = 1, match:title = .*Bitwarden.*
windowrule = size = 600 750, match:title = .*Bitwarden.*

windowrule = float = yes, match:title = .*bitwarden.*
windowrule = center = 1, match:title = .*bitwarden.*
windowrule = size = 600 750, match:title = .*bitwarden.*

windowrule = float = yes, match:title = .*kazuki.*
windowrule = center = 1, match:title = .*kazuki.*
windowrule = size = 600 750, match:title = .*kazuki.*

windowrule = float = yes, match:title = .*Extension:.*
windowrule = center = 1, match:title = .*Extension:.*
windowrule = size = 600 750, match:title = .*Extension:.*

windowrule {
  name = browser-pip
  match:title = ^(Picture-in-Picture)$
  float = yes
  size = 480 270
  pin = yes
}

# -----------------------------------------------------
# Apps (Floating, Centered, 60% Window Size)
# -----------------------------------------------------

# Slack
windowrule {
  name = slack-float
  match:class = ^(slack|Slack|com.slack.Slack)$
  float = yes
  center = 1
  size = 60% 60%
}

windowrule {
  name = slack-huddle-float
  match:class = ^(slack|Slack|com.slack.Slack)$
  match:title = ^(.*Huddle.*)$
  float = yes
  center = 1
  size = 500 400
}

# Discord
windowrule {
