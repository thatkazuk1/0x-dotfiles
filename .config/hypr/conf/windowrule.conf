# Image Viewers
windowrule {
  name = image-viewer-float
  match:class = ^(eog|org.gnome.eog|loupe|org.gnome.Loupe)$
  float = yes
  size = 75% 75%
  center = 1
}

# PDF Viewers
windowrule {
  name = pdf-viewer-float
  match:class = ^(evince|org.gnome.Evince|papers|org.gnome.Papers|org.pwmt.zathura|org.kde.okular|mupdf)$
  float = yes
  size = 75% 75%
  center = 1
}

# Single-file Text Editors
windowrule {
  name = text-editor-float
  match:class = ^(org.gnome.TextEditor|gedit|org.gnome.gedit|mousepad|xed|org.gnome.gitlab.somas.Apostrophe)$
  float = yes
  size = 75% 75%
  center = 1
}

# nmTUI
windowrule {
  name = nmtui
  match:class = ^(kitty)$
  match:title = ^(nmtui)$
  float = yes
  center = 1
  size = 1280 720
}

# HyprHelp
windowrule {
  name = hyprhelp-overlay
  match:title = ^(hyprhelp)$
  float = yes
  center = 1
  size = 1280 720
  dim_around = yes
  stay_focused = yes
}

# -----------------------------------------------------
# Layer Rules
# -----------------------------------------------------
layerrule {
  name = ukishima_rule
  blur = on
  ignore_alpha = 0.5
  match:namespace = quickshell
}
