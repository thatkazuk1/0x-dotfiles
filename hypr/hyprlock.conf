## -----------------------------------------------------
#  Hyprlock Nord Theme
## -----------------------------------------------------

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = false
}

# -----------------------------------------------------
# BACKGROUND
# -----------------------------------------------------
background {
    monitor =
    path = /home/oxdfa/Pictures/Saved-Pictures/wallpapers/background-forest.jpg
    blur_passes = 2
    zindex = -2
}

# Dim overlay
shape {
    monitor =
    size = 100%, 100%
    color = rgba(46, 52, 64, 0.70)
    zindex = -1
}

# -----------------------------------------------------
# STATUS BAR (Top Right - Battery)
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:2000] echo "$(cat /sys/class/power_supply/BAT*/capacity)% 󱈏"
    color = rgb(136, 192, 208)
    font_size = 14
    font_family = JetBrains Mono NFM
    position = -40, -40
    halign = right
    valign = top

    shadow_passes = 0
}

# -----------------------------------------------------
# HEADER (Top Left - Date & Weather)
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %b %d")"
    color = rgb(216, 222, 233)
    font_size = 22
    font_family = JetBrains Mono NFM

    position = 40, -40
    halign = left
    valign = top

    shadow_passes = 0
}

label {
    monitor =
    text = cmd[update:1800000] echo "$(curl -s 'wttr.in?format=%c+%C,+%t'| tr -d '+')"
    color = rgba(216, 222, 233, 0.7)
    font_size = 14
    font_family = JetBrains Mono NFM

    position = 40, -85
    halign = left
    valign = top

    shadow_passes = 0
}

# -----------------------------------------------------
# CLOCK
# -----------------------------------------------------
# HOURS
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgb(136, 192, 208)

    font_size = 150
    font_family = Inter Medium

    # Positive Y moves up.
    position = 0, 80

    halign = center
    valign = center

    shadow_passes = 0
    shadow_size = 0
    shadow_color = rgb(0,0,0)
}

# MINUTES
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgb(216, 222, 233)

    font_size = 150

    font_family = Inter Medium
    # Negative Y moves down.
    position = 0, -115

    halign = center
    valign = center

    shadow_passes = 0
    shadow_size = 0
    shadow_color = rgb(0,0,0)
}

# -----------------------------------------------------
# INPUT FIELD (Bottom Center)
# -----------------------------------------------------
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgba(136, 192, 208, 0.5) # Frost blue ring
    inner_color = rgba(46, 52, 64, 0.8) # Polar night inside
    font_color = rgb(216, 222, 233) # Snow storm text
    check_color = rgb(163, 190, 140) # Aurora Green for authenticating
    fail_color = rgb(191, 97, 106) # Aurora Red for wrong password

    fade_on_empty = true
    placeholder_text = <i>Unlock</i>
    hide_input = false

    rounding = -1

    position = 0, 80
    halign = center
    valign = bottom

    shadow_passes = 0
}

# -----------------------------------------------------
# POWER MENU BUTTONS (Bottom Right)
# -----------------------------------------------------

# Shutdown
label {
    monitor =
    text = 
    color = rgb(191, 97, 106) # Nord Aurora Red
    font_size = 26
    font_family = JetBrains Mono NFM

    position = -30, 40
    halign = right
    valign = bottom

    shadow_passes = 1

    onclick = systemctl poweroff
}

# Reboot
label {
    monitor =
    text = 
    color = rgb(208, 135, 112) # Nord Aurora Orange
    font_size = 26
    font_family = JetBrains Mono NFM

    position = -90, 40
    halign = right
    valign = bottom

    shadow_passes = 1

    onclick = systemctl reboot
}

# Suspend
label {
    monitor =
    text = 󰒲
    color = rgb(235, 203, 139) # Nord Aurora Yellow
    font_size = 26
    font_family = JetBrains Mono NFM

    position = -150, 40
    halign = right
    valign = bottom

    shadow_passes = 1

    onclick = systemctl suspend
}
