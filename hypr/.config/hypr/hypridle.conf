general {
    # Fired when another app (or loginctl lock-session) asks us to lock.
    # The `pidof` guard prevents stacking multiple hyprlock instances.
    lock_cmd       = pidof hyprlock || hyprlock

    # Run before the system suspends — lock first so we wake on a lock screen.
    before_sleep_cmd = loginctl lock-session

    # Reset the DPMS state after wake so the display turns back on predictably.
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# ------------------------------------------------------------
# 1) Dim the screen after 2.5 minutes, restore on activity.
# ------------------------------------------------------------
listener {
    timeout   = 150
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# ------------------------------------------------------------
# 2) Lock the session after 5 minutes.
# ------------------------------------------------------------
listener {
    timeout   = 300
    on-timeout = loginctl lock-session
}

# ------------------------------------------------------------
# 3) Turn off displays shortly after locking — saves power.
#    Any keyboard/mouse activity wakes them again.
# ------------------------------------------------------------
listener {
    timeout   = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# ------------------------------------------------------------
# 4) Suspend after 15 minutes idle.
#    Remove this listener if you prefer the machine to stay awake on AC.
# ------------------------------------------------------------
listener {
    timeout   = 900
    on-timeout = systemctl suspend
}
