# ╚═╝  ╚═╝╚══════╝   ╚═╝   ╚═════╝ ╚═╝╚═╝  ╚═══╝╚═════╝ ╚═╝╚═╝  ╚═══╝ ╚═════╝
#-----------------------------------------------------------------------------

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, Q, exec, $terminal # [Terminal] Launch the terminal
bind = $mainMod, C, killactive, # [Close Window] Kill the active window
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit # [Power Menu] Open Hyprshutdown or exit Hyprland
bind = $mainMod, E, exec, $fileManager # [File Manager] Open the file manager
bind = $mainMod, V, togglefloating, # [Floating] Toggle floating mode for active window
# bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # [Pseudo Tiling] Toggle pseudo tiling
bind = $mainMod, J, layoutmsg, togglesplit # [Toggle Split] Toggle window split direction

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l # [Focus Left] Move focus to the left
bind = $mainMod, right, movefocus, r # [Focus Right] Move focus to the right
bind = $mainMod, up, movefocus, u # [Focus Up] Move focus up
bind = $mainMod, down, movefocus, d # [Focus Down] Move focus down

# Swap window position with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, swapwindow, l # [Swap Left] Swap window position to the left
bind = $mainMod SHIFT, right, swapwindow, r # [Swap Right] Swap window position to the right
bind = $mainMod SHIFT, up, swapwindow, u # [Swap Up] Swap window position up
bind = $mainMod SHIFT, down, swapwindow, d # [Swap Down] Swap window position down


# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1 # [Workspace 1] Switch to workspace 1
bind = $mainMod, 2, workspace, 2 # [Workspace 2] Switch to workspace 2
bind = $mainMod, 3, workspace, 3 # [Workspace 3] Switch to workspace 3
bind = $mainMod, 4, workspace, 4 # [Workspace 4] Switch to workspace 4
bind = $mainMod, 5, workspace, 5 # [Workspace 5] Switch to workspace 5
bind = $mainMod, 6, workspace, 6 # [Workspace 6] Switch to workspace 6
bind = $mainMod, 7, workspace, 7 # [Workspace 7] Switch to workspace 7
bind = $mainMod, 8, workspace, 8 # [Workspace 8] Switch to workspace 8
bind = $mainMod, 9, workspace, 9 # [Workspace 9] Switch to workspace 9
bind = $mainMod, 0, workspace, 10 # [Workspace 10] Switch to workspace 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1 # [Move to 1] Move active window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 # [Move to 2] Move active window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 # [Move to 3] Move active window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 # [Move to 4] Move active window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 # [Move to 5] Move active window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6 # [Move to 6] Move active window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7 # [Move to 7] Move active window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8 # [Move to 8] Move active window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9 # [Move to 9] Move active window to workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10 # [Move to 10] Move active window to workspace 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic # [Scratchpad] Toggle special magic workspace
bind = $mainMod SHIFT, S, movetoworkspace, special:magic # [Move to Scratchpad] Move window to special magic workspace

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1 # [Next Workspace] Scroll to next workspace
bind = $mainMod, mouse_up, workspace, e-1 # [Previous Workspace] Scroll to previous workspace

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow # [Move Window] Hold and drag to move window
bindm = $mainMod, mouse:273, resizewindow # [Resize Window] Hold and drag to resize window

# Laptop multimedia keys for volume and LCD brightness
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5 # [Vol Up] Increase audio volume
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -5 # [Vol Down] Decrease audio volume
bindel = , XF86AudioMute,        exec, swayosd-client --output-volume mute-toggle # [Mute] Toggle audio mute
bindel = , XF86AudioMicMute,     exec, swayosd-client --input-volume mute-toggle # [Mic Mute] Toggle microphone mute
bindel = , XF86MonBrightnessUp,   exec, swayosd-client --brightness +5 # [Brightness Up] Increase screen brightness
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness -5 # [Brightness Down] Decrease screen brightness

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next # [Next Track] Skip to next track
bindl = , XF86AudioPause, exec, playerctl play-pause # [Pause] Pause playback
bindl = , XF86AudioPlay, exec, playerctl play-pause # [Play] Resume playback
bindl = , XF86AudioPrev, exec, playerctl previous # [Prev Track] Skip to previous track

# Lock keys — these don't trigger any action (caps lock IS the toggle), they just show the OSD
bindrl = , Caps_Lock,    exec, swayosd-client --caps-lock # [Caps Lock] Show Caps Lock OSD
bindrl = , Num_Lock,     exec, swayosd-client --num-lock # [Num Lock] Show Num Lock OSD
bindrl = , Scroll_Lock,  exec, swayosd-client --scroll-lock # [Scroll Lock] Show Scroll Lock OSD

# Toggle fullscreen
bind = SUPER, F, fullscreen # [Fullscreen] Toggle fullscreen mode

# Notifications
bind = $mainMod, N, exec, swaync-client -t -sw # [Notifications] Open SwayNC notification center
bind = $mainMod SHIFT, N, exec, swaync-client -d -sw # [Do Not Disturb] Toggle Do Not Disturb

# Manual lock
bind = $mainMod, L, exec, loginctl lock-session # [Lock Screen] Lock the session

# Screenshots
bind = ,       Print, exec, ~/scripts/screenshot.sh region # [Snip Region] Capture selected region
bind = SHIFT,  Print, exec, ~/scripts/screenshot.sh monitor # [Snip Monitor] Capture current monitor
bind = CTRL,   Print, exec, ~/scripts/screenshot.sh window # [Snip Window] Capture active window
bind = $mainMod, Print, exec, ~/scripts/screenshot.sh edit # [Snip Edit] Capture and open in editor

# Cycle to a new random wallpaper
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper.sh # [Random Wallpaper] Cycle to a new random wallpaper
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper-picker.sh # [Pick Wallpaper] Open wallpaper picker
bind = $mainMod, T, exec, ~/.config/hypr/scripts/theme-picker.sh # [Theme Picker] Open theme picker

# Show the graphical app launcher
bind = ALT, SPACE, exec, wofi # [App Launcher] Open Wofi application menu

# wlogout
bind = $mainMod, ESCAPE, exec, wlogout -p layer-shell # [Logout Menu] Open wlogout power menu

# HyprHelp
bind = $mainMod, H, exec, env GDK_BACKEND=x11 ~/.config/hypr/scripts/hyprhelp/hyprhelp.py # [HyprHelp] Show this keybind cheatsheetr
